<!DOCTYPE html>
<!--
  Sage — https://sagetarot.app
  Copyright © 2026 Future Proof Works. All rights reserved.

  Builds one page per card under /cards/. Each page IS the app: it ships the
  same scripts and stylesheets, declares which card it is, and carries that
  card's text in the HTML so search engines can read it. The app boots over the
  top, so a visitor arriving from a search result lands inside Sage looking at
  that card — no separate page, no button to press.

  Open in Chrome or Edge, press the button, choose the site root.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sage — build card pages</title>
<style>
  body{font-family:ui-sans-serif,system-ui,sans-serif;max-width:760px;margin:40px auto;
       padding:0 24px;background:#11141f;color:#ece6da;line-height:1.6;}
  h1{font-weight:500;}
  code{background:#1e2334;padding:2px 6px;border-radius:3px;font-size:.9em;}
  button{background:#c6a768;color:#1a1508;border:none;padding:13px 24px;border-radius:5px;
         font-size:.95rem;font-weight:600;cursor:pointer;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  #log{margin-top:24px;font-family:ui-monospace,monospace;font-size:.82rem;color:#8d879a;
       max-height:340px;overflow:auto;border:1px solid rgba(198,167,104,.2);padding:14px;border-radius:5px;}
  .ok{color:#7fa87f;} .bad{color:#c07a80;}
</style>
</head>
<body>

<h1>Build card pages</h1>
<p>Writes <code>cards/index.html</code>, one page per card, and a fresh
<code>sitemap.xml</code>. Choose your <strong>site root</strong> — the folder holding
<code>index.html</code>.</p>

<button id="go">Choose folder and build</button>
<div id="log"></div>

<script src="../js/cards.js"></script>
<script src="../js/cards-minor.js"></script>
<script src="../js/cards-minor2.js"></script>
<script src="../js/cards-plain.js"></script>
<script src="../js/cards-plain2.js"></script>
<script src="../js/cards-plain3.js"></script>

<script>
const S = window.SAGE;
const SITE = 'https://sagetarot.app';
const GA = 'G-FTYHWRG9RH';
const logEl = document.getElementById('log');

function log(m, c){ logEl.innerHTML += '<div class="'+(c||'')+'">'+m+'</div>'; logEl.scrollTop = 1e6; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function slug(n){ return n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }

const RANK = {1:'Ace',11:'Page',12:'Knight',13:'Queen',14:'King'};
const ROMAN = ['0','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII',
               'XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI'];

function plain(c,k){ const p = S.PLAIN && S.PLAIN[c.id]; return (p && p[k]) || c[k]; }
function short(c){ const p = S.PLAIN && S.PLAIN[c.id]; return (p && p.short) || ''; }
function kindOf(c){
  if (c.arcana === 'major') return 'Major Arcana · ' + ROMAN[c.num];
  return (RANK[c.num] || c.num) + ' of ' + c.suit.charAt(0).toUpperCase() + c.suit.slice(1);
}

/* Everything these pages share with index.html. Paths are ../ because the
   pages live one folder down; images and icons are absolute. */
function head(title, desc, canonical, image) {
  return `<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>${esc(title)}</title>
<meta name="description" content="${esc(desc)}">
<link rel="canonical" href="${canonical}">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="author" content="Future Proof Works">

<meta property="og:type" content="article">
<meta property="og:site_name" content="Sage">
<meta property="og:url" content="${canonical}">
<meta property="og:title" content="${esc(title)}">
<meta property="og:description" content="${esc(desc)}">
<meta property="og:image" content="${image}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="${esc(title)}">
<meta name="twitter:description" content="${esc(desc)}">
<meta name="twitter:image" content="${image}">

<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/theme.css">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icon/icon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="/icon/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon/apple-touch-icon-180.png">
<meta name="theme-color" content="#F3F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171A28" media="(prefers-color-scheme: dark)">

<script src="../js/theme-toggle.js"><\/script>

<script async src="https://www.googletagmanager.com/gtag/js?id=${GA}"><\/script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  (function(){
    var eu = true;
    try {
      var tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
      eu = /^Europe\\//.test(tz) || /^Atlantic\\/(Canary|Azores|Madeira|Reykjavik|Faroe)/.test(tz);
    } catch (e) {}
    var stored = null;
    try { stored = localStorage.getItem('sage.consent'); } catch (e) {}
    var granted = stored ? (stored === 'granted') : !eu;
    window.SAGE_CONSENT = { eu: eu, stored: stored, granted: granted };
    gtag('consent','default',{ ad_storage:'denied', ad_user_data:'denied',
      ad_personalization:'denied', analytics_storage: granted ? 'granted' : 'denied' });
  })();
  gtag('js', new Date());
  gtag('config', '${GA}', { debug_mode: /[?&]ga_debug=1/.test(location.search) });
<\/script>
<script src="../js/consent.js" defer><\/script>`;
}

const HEADER = `<header class="topbar">
  <div class="wrap">
    <a class="brand" href="/" data-nav="draw">
      <span class="mark">Sage</span><span class="sub">Tarot Journal</span>
    </a>
    <nav class="main" id="nav">
      <button data-nav="draw">Read</button>
      <button data-nav="journal">Journal</button>
      <button data-nav="library">Deck</button>
      <button data-nav="study">Learn</button>
    </nav>
    <div class="top-right" id="topRight">
      <span class="streak-chip" id="streakChip"></span>
      <button class="top-settings" data-nav="settings">Settings</button>
    </div>
  </div>
</header>`;

const FOOTER = `<footer class="site-foot">
  <div class="wrap">
    <span>&copy; <span id="footYear">2026</span> Future Proof Works</span>
    <span class="sep">//</span>
    <a href="https://futureproofworks.com" target="_blank" rel="noopener">FutureProofWorks.com</a>
    <span class="attrib">Artwork: Rider&ndash;Waite&ndash;Smith, Pamela Colman Smith, 1909 &mdash; public domain.</span>
  </div>
</footer>`;

const SCRIPTS = ['cards','cards-minor','cards-minor2','cards-plain','cards-plain2','cards-plain3',
  'spreads','topics','decks','yourcards','learn','engine','storage','ai','app']
  .map(n => `<script src="../js/${n}.js"><\/script>`).join('\n');

/* The card's text, in the markup the app itself uses, so the half-second before
   the app boots looks right — and so a crawler or a reader without JavaScript
   gets the whole thing. */
function cardBody(card) {
  const sh = short(card);
  return `<div class="wrap view doc">
  <div class="detail">
    <div>
      <div class="art"><img src="/images/${esc(card.img)}" alt="${esc(card.name)} from the Rider–Waite–Smith tarot deck"></div>
      <table class="meta-table"><tbody>
        <tr><td>Arcana</td><td>${card.arcana === 'major' ? 'Major · ' + ROMAN[card.num] : 'Minor'}</td></tr>
        <tr><td>Suit</td><td>${card.arcana === 'major' ? '—' : esc(card.suit.charAt(0).toUpperCase()+card.suit.slice(1))}</td></tr>
        <tr><td>Element</td><td>${esc(card.element)}</td></tr>
        <tr><td>Attribution</td><td>${esc(card.astro)}</td></tr>
      </tbody></table>
    </div>
    <div>
      <div class="eyebrow" style="font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:10px">${esc(kindOf(card))}</div>
      <h1 style="margin-bottom:14px">${esc(card.name)}</h1>
      ${sh ? `<p class="in-short big"><b>In short</b>${esc(sh)}</p>` : ''}

      <div class="mean-block"><h4>Upright</h4>
        <div class="kw" style="margin-bottom:12px">${card.kwU.map(k=>'<span>'+esc(k)+'</span>').join('')}</div>
        <div class="prose"><p>${esc(plain(card,'up'))}</p></div></div>

      <div class="mean-block rev"><h4>Reversed</h4>
        <div class="kw" style="margin-bottom:12px">${card.kwR.map(k=>'<span>'+esc(k)+'</span>').join('')}</div>
        <div class="prose"><p>${esc(plain(card,'rev'))}</p></div></div>

      <div class="look-closer" style="margin-bottom:26px"><b>In the picture</b>${esc(card.sym)}</div>
      <div class="note-card"><h4>The turn</h4><p>${esc(card.advice)}</p></div>
    </div>
  </div>
</div>`;
}

function cardPage(card) {
  const s = slug(card.name);
  const sh = short(card);
  const desc = ((sh ? sh + ' ' : '') + plain(card,'up')).slice(0, 300);

  return `<!DOCTYPE html>
<html lang="en">
<head>
${head(card.name + ' — tarot card meaning, upright and reversed | Sage',
       desc, SITE + '/cards/' + s + '.html', SITE + '/images/' + card.img)}
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[
 {"@type":"ListItem","position":1,"name":"Sage","item":"${SITE}/"},
 {"@type":"ListItem","position":2,"name":"Card meanings","item":"${SITE}/cards/"},
 {"@type":"ListItem","position":3,"name":"${esc(card.name)}"}]}
<\/script>
</head>
<body>
${HEADER}
<main id="app">
${cardBody(card)}
</main>
${FOOTER}
<script>window.SAGE_ROUTE = { view:'card', cardId:'${card.id}' };<\/script>
${SCRIPTS}
</body>
</html>`;
}

function indexPage(cards) {
  const groups = [
    ['Major Arcana', cards.filter(c=>c.arcana==='major')],
    ['Wands', cards.filter(c=>c.suit==='wands')],
    ['Cups', cards.filter(c=>c.suit==='cups')],
    ['Swords', cards.filter(c=>c.suit==='swords')],
    ['Pentacles', cards.filter(c=>c.suit==='pentacles')]
  ];
  const body = groups.map(([name,list]) => `
    <p class="section-label">${name}</p>
    <div class="lib-grid">${list.map(c=>`<a class="lib-card" href="${slug(c.name)}.html">
      <span class="thumb"><img src="/images/${esc(c.img)}" alt="${esc(c.name)}" loading="lazy"></span>
      <span class="nm">${esc(c.name)}</span></a>`).join('')}</div>`).join('');

  return `<!DOCTYPE html>
<html lang="en">
<head>
${head('All 78 tarot card meanings, upright and reversed | Sage',
  'Every card in the Rider–Waite–Smith tarot deck with its upright and reversed meaning in plain English, what to look for in the picture, its element and attribution.',
  SITE + '/cards/', SITE + '/images/RWS_Tarot_17_Star.jpg')}
</head>
<body>
${HEADER}
<main id="app">
  <div class="wrap view doc">
    <div class="page-head">
      <div class="eyebrow">Card meanings</div>
      <h1>All seventy-eight cards</h1>
      <p class="lede">Every card with its upright and reversed meaning in plain English, what to
      look for in the picture, its element and its astrological attribution.</p>
    </div>
    ${body}
  </div>
</main>
${FOOTER}
<script>window.SAGE_ROUTE = { view:'library' };<\/script>
${SCRIPTS}
</body>
</html>`;
}

function sitemap(cards) {
  const urls = [SITE + '/', SITE + '/cards/']
    .concat(cards.map(c => SITE + '/cards/' + slug(c.name) + '.html'));
  return `<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
${urls.map(u=>`  <url>\n    <loc>${u}</loc>\n    <changefreq>monthly</changefreq>\n  </url>`).join('\n')}
</urlset>
`;
}

async function write(dir, name, text) {
  const fh = await dir.getFileHandle(name, { create: true });
  const w = await fh.createWritable();
  await w.write(text);
  await w.close();
}

document.getElementById('go').addEventListener('click', async () => {
  const btn = document.getElementById('go');
  if (!window.showDirectoryPicker) { log('Use Chrome or Edge — this browser cannot write files.','bad'); return; }
  if (!S || !S.CARDS || S.CARDS.length !== 78) {
    log('Card data did not load — got ' + ((S&&S.CARDS&&S.CARDS.length)||0) + ' of 78.','bad'); return;
  }

  let root;
  try { root = await window.showDirectoryPicker({ mode:'readwrite' }); }
  catch (e) { log('Cancelled.','bad'); return; }

  btn.disabled = true;
  const cards = S.CARDS.slice();
  try {
    const dir = await root.getDirectoryHandle('cards', { create:true });
    for (const c of cards) {
      await write(dir, slug(c.name) + '.html', cardPage(c));
      log('cards/' + slug(c.name) + '.html','ok');
    }
    await write(dir, 'index.html', indexPage(cards));  log('cards/index.html','ok');
    await write(root, 'sitemap.xml', sitemap(cards));  log('sitemap.xml','ok');
    log('<br><strong class="ok">Done — ' + (cards.length+2) + ' files.</strong>');
  } catch (e) { log('Failed: ' + e.message,'bad'); }
  btn.disabled = false;
});
</script>
</body>
</html>
